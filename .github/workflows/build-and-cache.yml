name: Build and push to Cachix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-nix-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            # unfloader needs ftd2xx, which the flake only packages for Linux
            packages: .#toolchain .#chksum64 .#n64tool .#n64sym .#bass_v14 .#bass .#unfloader
          - name: macos-arm64
            runner: macos-latest
            packages: .#toolchain .#chksum64 .#n64tool .#n64sym .#bass_v14 .#bass
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: n64-tools
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build --no-link --keep-going --print-build-logs ${{ matrix.packages }}
